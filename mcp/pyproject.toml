[project]
name = "rg-mcp"
version = "0.1.0"
description = "MCP server for curating the rreading-glasses metadata store"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.scripts]
rg-mcp = "rg_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
